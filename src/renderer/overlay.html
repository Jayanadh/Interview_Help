<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Help_Interview</title>
<style>
  :root {
    --panel: rgba(20, 22, 27, 0.94);
    --fg: #f2f4f7; --muted: #8d95a1; --line: rgba(255,255,255,.08);
    --accent: #7aa7ff; --ok: #6fdba0; --warn: #ffc866; --err: #ff8f8f;
    --scale: 1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; }
  body {
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--fg); display: flex; flex-direction: column;
    padding: 7px; overflow: hidden;
  }
  .panel {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    backdrop-filter: blur(20px);
  }

  /* Header: thin, draggable, never competes for attention. */
  header {
    -webkit-app-region: drag; user-select: none;
    display: flex; align-items: center; gap: 7px;
    padding: 6px 11px; border-bottom: 1px solid var(--line);
    font-size: 10.5px; color: var(--muted); flex-shrink: 0;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.err { background: var(--err); }
  .dot.warn { background: var(--warn); }
  #status { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ttft { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; opacity: .7; }

  /*
   * Toolbar. The only click targets in the whole overlay, so they have to be
   * no-drag — the header above them is the drag handle and the region rule
   * inherits.
   */
  .bar {
    -webkit-app-region: no-drag; flex-shrink: 0;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 9px; border-bottom: 1px solid var(--line);
  }
  .langwrap { position: relative; display: flex; align-items: center; gap: 5px; }
  .bar label { font-size: 10px; color: var(--muted); letter-spacing: .02em; }
  #lang {
    width: 116px; padding: 4px 7px; font: inherit; font-size: 11px;
    color: var(--fg); background: rgba(255,255,255,.06);
    border: 1px solid var(--line); border-radius: 6px; outline: none;
  }
  #lang:focus { border-color: var(--accent); background: rgba(255,255,255,.1); }
  /* What the model will actually be told, which is not always what you typed. */
  #langEcho {
    font-size: 10px; color: var(--ok); white-space: nowrap;
    max-width: 130px; overflow: hidden; text-overflow: ellipsis;
  }
  #langEcho.guess { color: var(--warn); }

  #suggest {
    position: absolute; top: 100%; left: 0; z-index: 20; margin-top: 4px;
    min-width: 150px; max-height: 190px; overflow-y: auto; display: none;
    background: #23262d; border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); padding: 4px;
  }
  #suggest.show { display: block; }
  #suggest div {
    padding: 5px 9px; border-radius: 5px; font-size: 11.5px; cursor: pointer;
    white-space: nowrap;
  }
  #suggest div:hover, #suggest div.sel { background: rgba(122,167,255,.22); }

  #solve {
    -webkit-app-region: no-drag; margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    padding: 5px 11px; font: inherit; font-size: 11px; font-weight: 600;
    color: var(--fg); background: rgba(122,167,255,.16);
    border: 1px solid rgba(122,167,255,.4); border-radius: 6px; cursor: pointer;
  }
  #solve:hover:not(:disabled) { background: rgba(122,167,255,.3); }
  #solve:disabled { opacity: .5; cursor: progress; }
  #solve .sk { font-size: 9.5px; opacity: .65; font-family: ui-monospace, Menlo, monospace; }

  /* The question being answered — one line, never wraps past two. */
  .question {
    flex-shrink: 0; padding: 7px 16px 0;
    font-size: calc(10.5px * var(--scale)); color: var(--accent);
    line-height: 1.4; max-height: 2.9em; overflow: hidden;
  }

  /*
   * The answer column. Deliberately narrow: short line lengths are what
   * make text scannable in a glance rather than something you track across.
   * Type is large, weight is heavy on the headline, and the whole thing is
   * one column so there is a single place to look.
   */
  .answer {
    flex: 1; overflow-y: auto; padding: 9px 16px 15px; min-height: 0;
  }
  /* The headline sticks to the top so it stays readable no matter how far
     the prose is scrolled. It is the fallback answer if there is no time
     to read the rest. */
  .headline {
    display: block; position: sticky; top: 0; z-index: 2;
    font-size: calc(18px * var(--scale));
    font-weight: 650; line-height: 1.38; letter-spacing: -0.012em;
    margin: 0 0 calc(14px * var(--scale));
    padding-bottom: calc(10px * var(--scale));
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    color: #fff;
  }
  /* ~62 characters per line: long enough not to feel choppy, short enough
     to read without tracking across the window. */
  .body { max-width: 38em; }
  .body p {
    font-size: calc(15px * var(--scale));
    line-height: 1.68;
    margin: 0 0 calc(13px * var(--scale));
    color: #e6eaf0;
  }
  .body ul { margin: 0 0 12px; padding-left: calc(17px * var(--scale)); }
  .body li {
    font-size: calc(14.5px * var(--scale));
    line-height: 1.58; margin-bottom: calc(7px * var(--scale));
    color: #e6eaf0;
  }
  .body li::marker { color: var(--accent); }
  .body strong { font-weight: 650; color: #fff; }

  /*
   * Code. Never reflowed, never wrapped: a wrapped line of Python is a lie
   * about its indentation, and indentation is the syntax.
   */
  .code {
    position: relative; margin: 0 0 calc(13px * var(--scale));
    border: 1px solid var(--line); border-radius: 8px;
    background: #0e1014; overflow: hidden;
  }
  .code pre {
    margin: 0; padding: 11px 13px; overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: calc(12.5px * var(--scale)); line-height: 1.55;
    color: #e8edf5; tab-size: 4;
  }
  .code .tag {
    position: absolute; top: 0; right: 0; padding: 2px 8px;
    font-size: 9px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); background: rgba(255,255,255,.04);
    border-left: 1px solid var(--line); border-bottom: 1px solid var(--line);
    border-bottom-left-radius: 6px;
  }
  .code .copy {
    position: absolute; bottom: 6px; right: 6px; padding: 3px 9px;
    font: inherit; font-size: 10px; color: var(--muted); cursor: pointer;
    background: rgba(255,255,255,.07); border: 1px solid var(--line);
    border-radius: 5px; opacity: 0; transition: opacity .12s;
  }
  .code:hover .copy { opacity: 1; }
  .code .copy:hover { color: var(--fg); background: rgba(255,255,255,.14); }
  .body code.inline {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .89em; padding: 1px 5px; border-radius: 4px;
    background: rgba(255,255,255,.09);
  }

  .empty {
    color: var(--muted); font-size: 12px; text-align: center;
    padding: 30px 16px; line-height: 1.9;
  }
  kbd {
    background: rgba(255,255,255,.08); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px; font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .cursor {
    display: inline-block; width: 2px; height: 1em; background: var(--accent);
    vertical-align: text-bottom; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }

  /* Last thing the interviewer said. Collapsed by default — context when
     you want it, not a second thing pulling your eye. */
  .heard {
    flex-shrink: 0; padding: 5px 11px; border-top: 1px solid var(--line);
    font-size: 10.5px; color: var(--muted); line-height: 1.4;
    max-height: 2.8em; overflow: hidden; display: none;
  }
  .heard.show { display: block; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.13); border-radius: 4px; }
</style>
</head>
<body>
  <div class="panel">
    <header>
      <span class="dot" id="dot"></span>
      <span id="status">Starting…</span>
      <span id="ttft"></span>
    </header>
    <div class="bar">
      <div class="langwrap">
        <label for="lang">Code in</label>
        <input id="lang" type="text" spellcheck="false" autocomplete="off"
               placeholder="python" title="Any language — it matches the nearest one" />
        <div id="suggest"></div>
      </div>
      <span id="langEcho"></span>
      <button id="solve" title="Screenshot the screen behind this panel and solve what is on it">
        Solve screen <span class="sk">⌘⇧⏎</span>
      </button>
    </div>
    <div class="question" id="question"></div>
    <div class="answer" id="answer">
      <div class="empty">
        Listening.<br />
        <kbd>⌘/Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Space</kbd> to answer on demand<br />
        <kbd>⌘/Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>⏎</kbd> to read the screen and write code
      </div>
    </div>
    <div class="heard" id="heard"></div>
  </div>
  <script src="../shared/languages.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
